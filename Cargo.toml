[package]
name = "lexpeek"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Screen text translator for GNOME on Wayland"
authors = ["nihilmagnum <megasanial@gmail.com>"]
license = "MIT"
repository = "https://github.com/nihilmagnum/lexpeek"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast", "screenshot"] }
async-channel = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tesseract = "0.15.2"
thiserror = "2.0.21"
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.deb]
section = "utils"
extended-description = """\
Translates text on the screen: select an area or text in any window, press a shortcut \
and get the translation with a dictionary article and speech."""
# $auto finds the libraries the binary links against; it cannot find wl-clipboard and the GStreamer plugins.
depends = "$auto, wl-clipboard, gstreamer1.0-plugins-good"
assets = [
    ["target/release/lexpeek", "usr/bin/", "755"],
    ["data/io.github.nihilmagnum.Lexpeek.desktop", "usr/share/applications/", "644"],
    ["data/io.github.nihilmagnum.Lexpeek.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/lexpeek/", "644"],
]
