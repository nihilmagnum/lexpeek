name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    # Пакет собирается против библиотек конкретного выпуска Ubuntu, поэтому сборка идёт в нём.
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config clang libclang-dev \
            libgtk-4-dev libtesseract-dev libleptonica-dev

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Test
        run: cargo test --locked

      - name: Build package
        run: |
          cargo install cargo-deb --locked
          cargo deb --locked

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y --no-install-recommends gh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" target/debian/*.deb --title "$GITHUB_REF_NAME" --generate-notes
